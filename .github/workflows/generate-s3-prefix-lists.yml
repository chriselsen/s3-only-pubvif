name: generate-s3-prefix-lists

on:
  push:
    branches: [ main ]

  workflow_dispatch:

  repository_dispatch:
    types:
      - webhook

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:

      - name: checkout repo content
        uses: actions/checkout@v7

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: execute py script
        run: python generate-s3-prefix-lists.py

      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update S3 prefix lists"

      - name: push changes
        run: git push origin HEAD:main
